[project]
name = "role-diff"
version = "0.1.0"
description = "Diff the functional access of two AWS IAM roles and/or policies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.48",
]

[project.scripts]
role-diff = "role_diff.cli:main"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project_includes = ["src"]
